# Tokyo Twilight macOS Cool Blue-Gray Shell Surfaces (borderless)
[bar]
background       = "#15161c"
background-alpha = 0.0
text             = "#eef0f8"
active           = "#a855f7"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 28

[hyprland]
active-border            = "#00000000"
active-border-foreground = "#a855f7"

[controls]
normal-color              = "#eef0f8"
normal-fill-alpha         = 0.06
normal-border             = "#eef0f8"
normal-border-width       = 0
normal-border-alpha       = 0.0

hover-cursor-color        = "#ffffff"
hover-cursor-fill-alpha   = 0.12
hover-cursor-border       = "#a855f7"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color               = "#ffffff"
focus-fill-alpha          = 0.12
focus-border              = "#a855f7"
focus-border-width        = 0
focus-border-alpha        = 0.0

selected-color            = "#ffffff"
selected-fill-alpha       = 0.20
selected-border           = "#a855f7"
selected-border-width     = 0
selected-border-alpha     = 0.0

pressed-fill-alpha        = 0.24
selection-fill-alpha      = 0.35

[spacing]
scale           = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#1c1d24"
background-alpha = 0.94
text             = "#eef0f8"
border           = "#a855f7"
border-alpha     = 0.0
border-width     = 0

[tooltip]
background       = "#1c1d24"
background-alpha = 0.96
text             = "#eef0f8"
border           = "#a855f7"
border-alpha     = 0.0

[notifications]
background       = "#1c1d24"
background-alpha = 0.94
text             = "#eef0f8"
border           = "#a855f7"
border-alpha     = 0.0
border-width     = 0
countdown        = "#a855f7"

[launcher]
background                = "#1c1d24"
background-alpha          = 0.93
text                      = "#eef0f8"
border                    = "#a855f7"
border-alpha              = 0.0
border-width              = 0
scrim                     = "#101116"
scrim-alpha               = 0.50
selected-background       = "#a855f7"
selected-background-alpha = 0.22
selected-text             = "#ffffff"
selected-border           = "#a855f7"
selected-border-alpha     = 0.0
selected-border-width     = 0

[menu]
background                = "#1c1d24"
background-alpha          = 0.93
text                      = "#eef0f8"
border                    = "#a855f7"
border-alpha              = 0.0
border-width              = 0
scrim                     = "#101116"
scrim-alpha               = 0.50
selected-background       = "#a855f7"
selected-background-alpha = 0.22
selected-text             = "#ffffff"
selected-border           = "#a855f7"
selected-border-alpha     = 0.0
selected-border-width     = 0

[polkit]
background       = "#1c1d24"
background-alpha = 0.94
text             = "#eef0f8"
text-error       = "#f43f5e"
border           = "#a855f7"
border-error     = "#f43f5e"
border-alpha     = 0.0
border-width     = 0
scrim            = "#101116"
scrim-alpha      = 0.5
accent           = "#a855f7"

[lock]
background       = "#1c1d24"
background-alpha = 0.90
text             = "#eef0f8"
placeholder      = "#8b8da3"
text-error       = "#f43f5e"
border           = "#a855f7"
border-active    = "#a855f7"
border-error     = "#f43f5e"
border-alpha     = 0.0
selection        = "#a855f7"
selection-alpha  = 0.45

[image-picker]
text                    = "#eef0f8"
selected-border         = "#a855f7"
selected-border-alpha   = 1.0
unselected-border       = "#73758c"
unselected-border-alpha = 0.25
