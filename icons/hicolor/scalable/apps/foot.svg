<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a2e"/>
      <stop offset="50%" stop-color="#121120"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Top bar dots / subtle macOS terminal hint -->
  <circle cx="28" cy="26" r="3.5" fill="#f43f5e" opacity="0.85"/>
  <circle cx="40" cy="26" r="3.5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="52" cy="26" r="3.5" fill="#10b981" opacity="0.85"/>

  <!-- Prompt chevron '>' -->
  <path d="M 34 52 L 56 68 L 34 84" fill="none" stroke="url(#promptGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Cursor '_' -->
  <rect x="66" y="80" width="28" height="6.5" rx="3.25" fill="#f5f6ff" filter="url(#glow)"/>
</svg>
