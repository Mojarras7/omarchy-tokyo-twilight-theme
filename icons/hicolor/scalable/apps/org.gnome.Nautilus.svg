<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b33"/>
      <stop offset="50%" stop-color="#121124"/>
      <stop offset="100%" stop-color="#090912"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Minimalist folder back tab -->
  <path d="M 28 44 C 28 40, 31 37, 35 37 L 52 37 C 56 37, 59 39, 62 43 L 66 48 L 93 48 C 97 48, 100 51, 100 55 L 100 86 C 100 90, 97 93, 93 93 L 35 93 C 31 93, 28 90, 28 86 Z" fill="url(#folderBack)" opacity="0.6"/>

  <!-- Minimalist folder front flap with neon violet/purple gradient -->
  <rect x="28" y="52" width="72" height="42" rx="7" ry="7" fill="url(#folderFront)"/>

  <!-- Subtle inner line / file accent -->
  <path d="M 44 68 L 84 68" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 44 76 L 68 76" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
</svg>
